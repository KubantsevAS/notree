basePath: /api/v1
definitions:
  auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  node.CreateNodeRequest:
    properties:
      parent_id:
        type: string
      title:
        maxLength: 255
        type: string
      type:
        enum:
        - folder
        - note
        - task
        type: string
    required:
    - title
    - type
    type: object
  node.CreateNodeResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      parent_id:
        type: string
      sort_order:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  node.MoveNodeRequest:
    properties:
      parent_id:
        $ref: '#/definitions/node.NullableString'
      sort_order:
        type: integer
    type: object
  node.MoveNodeResponse:
    properties:
      parent_id:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  node.NodeResponse:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      parent_id:
        type: string
      sort_order:
        type: integer
      title:
        type: string
      type:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  node.NullableString:
    properties:
      isSet:
        type: boolean
      value:
        type: string
    type: object
  node.UpdateNodeRequest:
    properties:
      title:
        maxLength: 255
        type: string
      type:
        enum:
        - folder
        - note
        - task
        type: string
    type: object
  node.UpdateNodeResponse:
    properties:
      title:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  user.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  user.GetProfileResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_email_verified:
        type: boolean
      last_login_at:
        type: string
      locale:
        type: string
      preferences:
        type: object
      timezone:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  user.UpdateUserPreferencesRequest:
    properties:
      locale:
        maxLength: 10
        type: string
      preferences:
        type: object
      timezone:
        maxLength: 50
        type: string
    type: object
  user.UpdateUserPreferencesResponse:
    properties:
      locale:
        type: string
      preferences:
        type: object
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  user.UpdateUserProfileRequest:
    properties:
      avatar_url:
        maxLength: 500
        type: string
      username:
        maxLength: 100
        type: string
    type: object
  user.UpdateUserProfileResponse:
    properties:
      avatar_url:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  user.VerifyEmailByTokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API server for Notree app.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Notree API
  version: "0.2"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset link to the provided email address. Always
        returns 200 OK to prevent email enumeration.
      parameters:
      - description: User email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: password reset link has been sent
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Request password reset
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user and returns access/refresh tokens in HttpOnly
        cookies
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
        "400":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: User login
      tags:
      - Auth
  /auth/logout:
    post:
      description: Deletes refresh token from database and clears cookies
      responses:
        "204":
          description: No Content
      summary: User logout
      tags:
      - Auth
  /auth/refresh-tokens:
    post:
      description: Takes refresh_token from cookie, deletes it, issues a new token
        pair and sets new cookies
      produces:
      - application/json
      responses:
        "200":
          description: Tokens refreshed successfully
        "401":
          description: missing refresh token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Refresh tokens
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user and returns access/refresh tokens in HttpOnly
        cookies
      parameters:
      - description: Data for registration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
        "400":
          description: incorrect request format
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: user with that email already exists
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: User registration
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password using the token received from the forgot-password
        email.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: password has been reset successfully
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: invalid or expired token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Reset password with token
      tags:
      - Auth
  /nodes:
    post:
      consumes:
      - application/json
      parameters:
      - description: Information to create node
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/node.CreateNodeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/node.CreateNodeResponse'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Create a new node
      tags:
      - Nodes
  /nodes/{id}:
    delete:
      description: Soft deletes a specific node by ID and all its nested children
        recursively. The nodes are marked as deleted and can be restored later.
      parameters:
      - description: Node ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid node id format
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: node not found or access denied
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Delete a node
      tags:
      - Nodes
    patch:
      consumes:
      - application/json
      description: Partially updates a specific node (e.g., title or type) by ID.
        Does not affect hierarchy.
      parameters:
      - description: Node ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/node.UpdateNodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/node.UpdateNodeResponse'
        "400":
          description: invalid request body or node ID format
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: node not found or access denied
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Update node metadata
      tags:
      - Nodes
  /nodes/{id}/move:
    post:
      consumes:
      - application/json
      description: Changes the parent or sort order of a node. Pass `null` as parent_id
        to move the node to the root.
      parameters:
      - description: Node ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Move parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/node.MoveNodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/node.MoveNodeResponse'
        "400":
          description: invalid parent ID format or parent not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: node not found or access denied
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: node cannot be a descendant of itself (circular reference)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Move node in tree
      tags:
      - Nodes
  /nodes/{parent_id}:
    get:
      description: Retrieves a list of direct child nodes for a specific parent node.
      parameters:
      - description: Parent Node ID (UUID)
        in: path
        name: parent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/node.NodeResponse'
            type: array
        "400":
          description: invalid node id format or parent not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get child nodes
      tags:
      - Nodes
  /profile/me:
    get:
      description: Returns the profile data of an authorized user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.GetProfileResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get the current user's profile
      tags:
      - Profile
    patch:
      consumes:
      - application/json
      description: Updates the name and profile picture of the logged-in user
      parameters:
      - description: Information to update profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UpdateUserProfileResponse'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Update user profile
      tags:
      - Profile
  /profile/me/change-password:
    patch:
      consumes:
      - application/json
      description: Updates authenticated user's password. Requires old password for
        verification.
      parameters:
      - description: Old and new passwords
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: password updated
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: wrong old password
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Change user password
      tags:
      - Profile
  /profile/me/preference:
    patch:
      consumes:
      - application/json
      description: Updates the locale, time zone, and user preferences
      parameters:
      - description: New user preferences
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserPreferencesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UpdateUserPreferencesResponse'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Update user preferences
      tags:
      - Profile
  /profile/me/send-verification:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: email verification link has been sent
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Send email verification token
      tags:
      - Profile
  /profile/me/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.VerifyEmailByTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: email successfully verified
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: invalid or expired token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Verify email with token
      tags:
      - Profile
securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
